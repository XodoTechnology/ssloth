name: desktop-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create GitHub Releases on tag pushes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # NSIS installer
            platform: win32
            builder: --win
          - os: ubuntu-latest    # AppImage + deb
            platform: linux
            builder: --linux
          - os: macos-13         # Intel dmg/zip
            platform: darwin
            builder: --mac
          - os: macos-latest     # Apple Silicon dmg/zip
            platform: darwin
            builder: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - name: Build web bundle
        run: npm --prefix web ci && npm --prefix web run build
      - name: Install desktop deps
        run: npm --prefix desktop ci
      - name: Stage runtime + build packages
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tag pushes publish straight to a GitHub Release (installer +
          # latest.yml for electron-updater); manual runs stay artifact-only.
          PUBLISH_FLAG: ${{ startsWith(github.ref, 'refs/tags/') && '--publish always' || '--publish never' }}
        run: |
          node prepare-standalone.js --platform ${{ matrix.platform }}
          npx electron-builder ${{ matrix.builder }} $PUBLISH_FLAG
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssloth-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.yml
          if-no-files-found: error
