services:
  ssloth:
    build: .
    ports:
      - "8080:8080"
    environment:
      # REQUIRED in production: any long random string encrypts the vault.
      # Generate with: openssl rand -base64 48
      SSLOTH_MASTER_KEY: ${SSLOTH_MASTER_KEY:?Set SSLOTH_MASTER_KEY before deploying}
      # set 'true' when served over HTTPS (reverse proxy) so cookies are Secure
      SSLOTH_SECURE_COOKIES: ${SSLOTH_SECURE_COOKIES:-false}
      # set to 'true' or a CIDR when behind a trusted reverse proxy
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - ssloth-data:/data
    restart: unless-stopped

  # Opt-in test target: `docker compose --profile test up -d`
  # Disposable sshd on :2222 — tester/testpass123, key auth ready, TCP
  # forwarding on so tunnels and bastion jumps work. Do NOT deploy alongside
  # a real instance.
  test-sshd:
    image: lscr.io/linuxserver/openssh-server:latest
    profiles: ["test"]
    ports:
      - "2222:2222"
    environment:
      PUID: "1000"
      PGID: "1000"
      USER_NAME: tester
      USER_PASSWORD: testpass123
      PASSWORD_ACCESS: "true"
      SUDO_ACCESS: "false"
    volumes:
      - sshd-test-config:/config
      - ./test-sshd-init:/custom-cont-init.d:ro
    restart: unless-stopped

volumes:
  ssloth-data:
  sshd-test-config:
