<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- background + brand ring -->
  <rect width="256" height="256" rx="52" fill="#0a0d10"/>
  <rect x="4" y="4" width="248" height="248" rx="49" fill="none" stroke="#2aa87a" stroke-width="4"/>

  <!-- ears (barely-there, like a real sloth) -->
  <circle cx="88" cy="57" r="13" fill="#7a5a38"/>
  <circle cx="168" cy="57" r="13" fill="#7a5a38"/>

  <!-- head fur -->
  <ellipse cx="128" cy="114" rx="82" ry="70" fill="#7a5a38"/>

  <!-- face mask (cream) -->
  <ellipse cx="128" cy="118" rx="63" ry="55" fill="#ecdfc6"/>

  <!-- eye mask patches — slanted down toward the nose -->
  <ellipse cx="95" cy="106" rx="25" ry="13" transform="rotate(-24 95 106)" fill="#4c3d2a"/>
  <ellipse cx="161" cy="106" rx="25" ry="13" transform="rotate(24 161 106)" fill="#4c3d2a"/>

  <!-- eyes -->
  <circle cx="97" cy="106" r="7.5" fill="#f8f1df"/>
  <circle cx="159" cy="106" r="7.5" fill="#f8f1df"/>
  <circle cx="97" cy="106" r="3.4" fill="#2c2115"/>
  <circle cx="159" cy="106" r="3.4" fill="#2c2115"/>
  <circle cx="98.4" cy="104.6" r="1.3" fill="#ffffff"/>
  <circle cx="160.4" cy="104.6" r="1.3" fill="#ffffff"/>

  <!-- nose -->
  <ellipse cx="128" cy="127" rx="7.5" ry="8.5" fill="#3a2c1c"/>

  <!-- smile -->
  <path d="M113 141 Q 120.5 147.5 128 148.5 Q 135.5 147.5 143 141"
        stroke="#3a2c1c" stroke-width="5.5" fill="none" stroke-linecap="round"/>
</svg>
